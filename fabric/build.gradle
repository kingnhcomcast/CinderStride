plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

def localRuntimeModPaths = providers.provider {
    configurations.localRuntime.files
        .findAll { it.exists() }
        .collect { it.absolutePath }
        .join(File.pathSeparator)
}
def clientDevModJarPath = tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath

configurations {
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // Keep dependent Fabric mods on localRuntime so the run configs can feed them to Fabric Loader.
    add("localRuntime", "net.fabricmc:fabric-loader:${fabric_loader_version}")
    add("localRuntime", "net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // common is wired in via multiloader-loader with the correct attributes.
    // This resolves to Dirigo's fabric module through the composite build in settings.gradle.
    implementation "io.drahlek:fabric:1.0.0"
    add("localRuntime", "io.drahlek:fabric:1.0.0")

    // This points to Dirigo's common module
    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    implementation("io.drahlek:common:1.0.0") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

def clientRuntimeModPaths = "${localRuntimeModPaths.get()}${File.pathSeparator}${clientDevModJarPath}"

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
            property('fabric.addMods', clientRuntimeModPaths)
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
            property('fabric.addMods', localRuntimeModPaths.get())
        }
    }
}

tasks.named('runClient') {
    // The client run needs the built mod jar as a Fabric mod candidate in addition to the split source sets.
    dependsOn(tasks.named('jar'))
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}
