plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

configurations {
    fabricDevelopmentMods {
        canBeResolved = true
        canBeConsumed = false
    }
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
}

configurations.named('implementation') {
    extendsFrom(configurations.fabricDevelopmentMods)
}

def developmentModListFile = layout.buildDirectory.file("loom-cache/fabric-development-mods.txt")
def developmentModListPath = "@${developmentModListFile.get().asFile.absolutePath}"
def clientDevelopmentModListFile = layout.buildDirectory.file("loom-cache/fabric-client-development-mods.txt")
def clientDevelopmentModListPath = "@${clientDevelopmentModListFile.get().asFile.absolutePath}"
def hasFabricMetadata = { File file ->
    if (!file.name.endsWith('.jar')) {
        return false
    }

    def zip = new java.util.zip.ZipFile(file)
    try {
        return zip.getEntry('fabric-installer.json') != null || zip.getEntry('fabric.mod.json') != null
    } finally {
        zip.close()
    }
}
def resolveFabricDevelopmentModPaths = {
    configurations.fabricDevelopmentMods.resolve()
            .findAll(hasFabricMetadata)
            .collect { it.absolutePath }
            .sort()
}

tasks.register('writeFabricDevelopmentModList') {
    inputs.files(configurations.fabricDevelopmentMods)
    outputs.file(developmentModListFile)

    doLast {
        def outputFile = developmentModListFile.get().asFile
        outputFile.parentFile.mkdirs()

        outputFile.setText(resolveFabricDevelopmentModPaths().join(System.lineSeparator()), 'UTF-8')
    }
}

tasks.register('writeFabricClientDevelopmentModList') {
    dependsOn(tasks.named('jar'))
    inputs.files(configurations.fabricDevelopmentMods, tasks.named('jar'))
    outputs.file(clientDevelopmentModListFile)

    doLast {
        def outputFile = clientDevelopmentModListFile.get().asFile
        outputFile.parentFile.mkdirs()

        def clientModFiles = resolveFabricDevelopmentModPaths() + tasks.named('jar').get().archiveFile.get().asFile.absolutePath
        outputFile.setText(clientModFiles.unique().join(System.lineSeparator()), 'UTF-8')
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    add("fabricDevelopmentMods", "net.fabricmc:fabric-loader:${fabric_loader_version}")
    add("fabricDevelopmentMods", "net.fabricmc.fabric-api:fabric-api:${fabric_version}")

    // common is wired in via multiloader-loader with the correct attributes
    // This now points to Dirigo's fabric module thanks to the substitution above
    add("fabricDevelopmentMods", "io.drahlek:fabric:1.0.0")

    // This points to Dirigo's common module
    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    implementation("io.drahlek:common:1.0.0") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "modid" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            property('fabric.addMods', clientDevelopmentModListPath)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            property('fabric.addMods', developmentModListPath)
            runDir('runs/server')
        }
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}

['runClient', 'runServer'].each { taskName ->
    tasks.named(taskName) {
        dependsOn(tasks.named('writeFabricDevelopmentModList'))
    }
}

tasks.named('runClient') {
    dependsOn(tasks.named('writeFabricClientDevelopmentModList'))
}
