plugins {
    id 'multiloader-loader'
    id 'fabric-loom'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
    maven { url "https://maven.nucleoid.xyz/" }
}

configurations {
    commonClientResources {
        canBeResolved = true
    }
    commonClientJava {
        canBeResolved = true
    }
    fabricRunModCandidates {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_minecraft}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    fabricRunModCandidates("net.fabricmc:fabric-loader:${fabric_loader_version}") {
        transitive = false
    }
    fabricRunModCandidates("net.fabricmc.fabric-api:fabric-api:${fabric_version}") {
        transitive = false
    }
    include(implementation("org.reflections:reflections:0.10.2"))
    include(implementation("org.javassist:javassist:3.28.0-GA"))

    // This points to Dirigo's common module
    def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
    compileOnly("io.drahlek:common:${dirigo_version}") {
        attributes {
            attribute(loaderAttribute, 'common')
        }
    }

    compileOnly "org.projectlombok:lombok:1.18.44"
    annotationProcessor "org.projectlombok:lombok:1.18.44"

    add("commonClientResources", project(path: ':common', configuration: 'commonClientResources'))
    add("commonClientJava", project(path: ':common', configuration: 'commonClientJava'))
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }

    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

def dirigoFabricJar = rootProject.file("../Dirigo/fabric/build/libs/dirigo-fabric-${minecraft_version}-${dirigo_version}.jar")
def dirigoFabricRemapJar = gradle.includedBuild('Dirigo').task(':fabric:remapJar')

tasks.named('runClient') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        systemProperty('fabric.addMods', ([dirigoFabricJar.absolutePath] + configurations.fabricRunModCandidates.files.collect { it.absolutePath }).join(File.pathSeparator))
    }
}

tasks.named('runServer') {
    dependsOn(dirigoFabricRemapJar)
    doFirst {
        systemProperty('fabric.addMods', ([dirigoFabricJar.absolutePath] + configurations.fabricRunModCandidates.files.collect { it.absolutePath }).join(File.pathSeparator))
    }
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'includeInternal', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

tasks.named('processClientResources') {
    dependsOn(configurations.commonClientResources)
    from(configurations.commonClientResources)
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('compileClientJava', JavaCompile) {
    dependsOn(configurations.commonClientJava)
    source(configurations.commonClientJava)
}
