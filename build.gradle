plugins {
    id 'base'
    // see https://fabricmc.net/develop/ for new versions
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.140' apply false
}

subprojects {
    tasks.withType(Checkstyle).configureEach {
        // This stops Checkstyle from failing the build or logging missing Javadoc
        enabled = false
    }

    tasks.withType(Javadoc).configureEach {
        // This prevents the Javadoc tool from complaining about missing comments
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

def subprojectLifecycleTasks = { String taskName ->
    subprojects.collect { "${it.path}:${taskName}" }
}

tasks.named('assemble') {
    description = 'Assembles all CinderStride subprojects and the included Dirigo build.'
    dependsOn(subprojectLifecycleTasks('assemble'))
    dependsOn(gradle.includedBuild('Dirigo').task(':assemble'))
}

tasks.named('check') {
    description = 'Runs checks for all CinderStride subprojects and the included Dirigo build.'
    dependsOn(subprojectLifecycleTasks('check'))
    dependsOn(gradle.includedBuild('Dirigo').task(':check'))
}

tasks.named('build') {
    description = 'Builds all CinderStride subprojects and the included Dirigo build.'
    dependsOn(subprojectLifecycleTasks('build'))
    dependsOn(gradle.includedBuild('Dirigo').task(':build'))
}

tasks.named('clean') {
    description = 'Cleans all CinderStride subprojects and the included Dirigo build.'
    dependsOn(subprojectLifecycleTasks('clean'))
    dependsOn(gradle.includedBuild('Dirigo').task(':clean'))
}
